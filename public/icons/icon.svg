<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1E38"/>
      <stop offset="50%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#030A14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588"/>
      <stop offset="35%" stop-color="#E5B842"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="crossGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#F6C85F"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F6C85F" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#071324" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Gold Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Holy Light Rays / Radial Glow -->
  <circle cx="256" cy="220" r="180" fill="url(#sunGlow)"/>

  <!-- Geometric Rays radiating from Cross -->
  <g opacity="0.2" stroke="url(#goldGrad)" stroke-width="2">
    <line x1="256" y1="210" x2="256" y2="80"/>
    <line x1="256" y1="210" x2="160" y2="110"/>
    <line x1="256" y1="210" x2="352" y2="110"/>
    <line x1="256" y1="210" x2="110" y2="180"/>
    <line x1="256" y1="210" x2="402" y2="180"/>
  </g>

  <!-- Group for Bible & Cross with Elevation Shadow -->
  <g filter="url(#shadow)">
    <!-- Bible Base Cover (Navy & Deep Blue Leather) -->
    <path d="M 90 340 C 130 355 200 355 256 335 C 312 355 382 355 422 340 L 426 360 C 384 375 312 375 256 355 C 200 375 128 375 86 360 Z" fill="#0C1F38" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Left Book Page Stack -->
    <path d="M 100 330 C 145 345 205 342 254 322 L 254 220 C 205 240 145 242 100 228 Z" fill="#E2E8F0"/>
    <!-- Left Top Page -->
    <path d="M 104 324 C 148 338 206 336 254 216 L 254 212 C 206 232 148 234 104 220 Z" fill="url(#pageGrad)"/>
    <!-- Left Page Texture Lines -->
    <line x1="130" y1="242" x2="230" y2="236" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="130" y1="258" x2="230" y2="252" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="130" y1="274" x2="230" y2="268" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="130" y1="290" x2="210" y2="284" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Book Page Stack -->
    <path d="M 412 330 C 367 345 307 342 258 322 L 258 220 C 307 240 367 242 412 228 Z" fill="#CBD5E1"/>
    <!-- Right Top Page -->
    <path d="M 408 324 C 364 338 306 336 258 216 L 258 212 C 306 232 364 234 408 220 Z" fill="url(#pageGrad)"/>
    <!-- Right Page Texture Lines -->
    <line x1="282" y1="236" x2="382" y2="242" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="282" y1="252" x2="382" y2="258" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="282" y1="268" x2="382" y2="274" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="282" y1="284" x2="362" y2="290" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Center Bible Spine Crease & Gold Marker Ribbon -->
    <path d="M 256 210 L 256 340" stroke="#B38F24" stroke-width="3"/>
    <!-- Red/Gold Ribbon Bookmark -->
    <path d="M 256 212 C 265 250 250 290 262 365 L 270 355 L 278 368 C 266 310 274 260 256 212 Z" fill="#DC2626" opacity="0.9"/>

    <!-- Subtle Golden Cross rising from center of Bible -->
    <!-- Vertical Cross Beam -->
    <rect x="249" y="112" width="14" height="116" rx="4" fill="url(#crossGlow)" filter="url(#glow)"/>
    <rect x="250" y="114" width="12" height="112" rx="3" fill="url(#goldGrad)"/>
    
    <!-- Horizontal Cross Beam -->
    <rect x="224" y="142" width="64" height="14" rx="4" fill="url(#crossGlow)" filter="url(#glow)"/>
    <rect x="226" y="144" width="60" height="10" rx="3" fill="url(#goldGrad)"/>
    
    <!-- Central Cross Highlight Jewel -->
    <circle cx="256" cy="149" r="4.5" fill="#FFFDF0"/>
  </g>

  <!-- App Title Typography in Icon: SABBATH LIFE -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#goldGrad)">SABBATH LIFE</text>
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#94A3B8">KUISHI KWA NENO</text>
</svg>
